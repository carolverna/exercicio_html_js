<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Validação: B maior que A</h1>

        <form id="form-numeros">
            <div class="campo">
                <label for="campoA">Campo A:</label>
                <input type="number" id="campoA" required>
            </div>

            <div class="campo">
                <label for="campoB">Campo B:</label>
                <input type="number" id="campoB" required>
            </div>

            <button type="submit">Validar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
